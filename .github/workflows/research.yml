name: research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pm-history:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/pm_history.py
      - uses: actions/upload-artifact@v4
        with:
          name: pm-hist
          path: research/out/pm_hist.json
          retention-days: 14
