<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>폴리마켓 비트코인 가격 발견</title><style>
:root{--bg:#0b0e14;--panel:#121722;--text:#e6e9ef;--muted:#8b93a7;--orange:#f5a524;--up:#26a69a;--down:#ef5350}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}main{max-width:1500px;margin:auto;padding:28px 16px 40px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}h1{font-size:23px;margin:0 0 5px;letter-spacing:-.4px}h2{font-size:16px;margin:0}.subtitle,.muted{color:var(--muted)}.subtitle{margin:0}.badges{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}.badge{white-space:nowrap;border:1px solid #293244;border-radius:20px;padding:5px 8px;color:var(--muted);font-size:12px}.badge.warn{border-color:var(--orange);color:var(--orange)}.panel{background:var(--panel);border:1px solid #20293a;border-radius:12px;padding:14px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}.spot{font-variant-numeric:tabular-nums;color:var(--orange);font-weight:650}.chart-wrap{position:relative;width:100%;height:410px}.small .chart-wrap{height:225px}canvas{display:block;width:100%;height:100%;touch-action:manipulation}.tip{position:absolute;pointer-events:none;z-index:2;max-width:210px;padding:7px 9px;border-radius:6px;background:#07090eec;border:1px solid #364052;color:var(--text);font-size:12px;line-height:1.5;display:none}.touch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}.touchbox h3{font-size:12px;color:var(--muted);margin:0 0 5px}.touchrow{display:grid;grid-template-columns:1fr 34px;gap:7px;align-items:center;font-size:12px;margin:3px 0}.bar{display:inline-block;width:55px;height:4px;background:#252d3c;border-radius:3px}.bar i{display:block;height:100%;background:var(--orange);border-radius:3px}.small-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}.empty{display:grid;place-items:center;height:100%;color:var(--muted)}.decision{min-height:36px;margin-top:9px;color:var(--muted);font-size:12px;line-height:1.55}footer{color:var(--muted);font-size:12px;line-height:1.7;margin:22px 3px 0}footer p{margin:4px 0}a{color:var(--orange)}@media(max-width:760px){main{padding:18px 16px 30px}header{display:block}.badges{justify-content:flex-start;margin-top:12px}.small-grid{grid-template-columns:1fr}.chart-wrap{height:350px}.small .chart-wrap{height:220px}.touch-grid{grid-template-columns:1fr}h1{font-size:21px}}
</style></head><body><main><header><div><h1>폴리마켓 비트코인 가격 발견</h1><p class="subtitle">예측시장 가격에 담긴 미래 가격 확률분포</p></div><div class="badges"><span id="age" class="badge">데이터 확인 중</span><span class="badge">Polymarket · Kalshi</span></div></header><section id="btc-panel" class="panel"></section><section id="small-grid" class="small-grid"></section><footer><p>출처: Polymarket · Kalshi · FRED · ECB (frankfurter) · Binance/Kraken</p><p>예측시장 가격은 참가자들의 베팅이 시사하는 확률이지 예보가 아니다.</p><p>유동성 낮은 구간은 잡음이 크다. 저유동 horizon은 라벨에 표시된다.</p><p>‘도달 근사’는 도달 확률에 반사원리를 적용한 근사다. 데이터는 10분마다 갱신된다.</p><p><a href="https://github.com/kimsubbae114/polymarket-btc" target="_blank" rel="noreferrer">GitHub 저장소</a></p></footer></main><script src="app.js"></script></body></html>
