<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>폴리마켓 비트코인 가격 발견</title><style>
:root{--bg:#0b0e14;--panel:#121722;--text:#e6e9ef;--muted:#8b93a7;--orange:#f5a524}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui;font-size:14px}main{max-width:1500px;margin:auto;padding:28px 16px 40px}header{display:flex;justify-content:space-between;margin-bottom:20px}h1{font-size:23px;margin:0}h2{font-size:16px;margin:0}.subtitle,.muted,footer{color:var(--muted)}.panel{background:var(--panel);border:1px solid #20293a;border-radius:12px;padding:14px;min-width:0}.panel-head{display:flex;justify-content:space-between;margin-bottom:7px}.spot{color:var(--orange)}.chart-wrap{position:relative;height:410px}.small .chart-wrap{height:225px}canvas{width:100%;height:100%}.tip{position:absolute;display:none;background:#07090eec;border:1px solid #364052;padding:7px;pointer-events:none}.touch-grid,.small-grid{display:grid;gap:12px}.touch-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:13px}.small-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:12px}.touchbox h3{font-size:12px;color:var(--muted);margin:7px 0}.touchrow{display:flex;justify-content:space-between;font-size:12px;line-height:1.55}.touch-divider{border-top:1px solid #657083;color:var(--muted);font-size:10px;margin-top:5px;padding-top:3px}footer{font-size:12px;margin-top:22px;line-height:1.7}footer a{color:var(--orange)}.badges{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.badge{border:1px solid #2a3446;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);white-space:nowrap}.badge.warn{color:var(--orange);border-color:var(--orange)}@media(max-width:760px){header{display:block}.badges{margin-top:8px}.small-grid,.touch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-wrap{height:350px}}
</style></head><body><main><header><div><h1>폴리마켓 비트코인 가격 발견</h1><p class="subtitle">예측시장 가격으로 그린 미래 가격 확률분포</p></div><div class="badges"><span id="data-age" class="badge">데이터 시각 확인 중…</span><span class="badge">Polymarket · Kalshi</span></div></header><section id="btc-panel" class="panel"></section><section id="small-grid" class="small-grid"></section><footer><p>출처: Polymarket · Kalshi · FRED · ECB(frankfurter) · Binance/Kraken · 10분마다 갱신</p><p>예측시장 가격은 참고용이며 베팅을 권장하거나 보장하는 확률·정보가 아닙니다.</p><p>변동성·유동성·구간은 다를 수 있습니다. * 표시는 낮은 유동성 시장.</p><p>하단 그래프는 근사치이며 원자료와 다를 수 있습니다.</p><p><a href="https://github.com/kimsubbae114/polymarket-btc">GitHub 저장소</a></p></footer></main><script src="app.js"></script></body></html>
